<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Métis — Lyon</title>

  <script>
    // =====================================================================
    //  SEUILS DES STATIONS — À MODIFIER ICI
    // =====================================================================
    //  SEUILS DE DÉMO, NON OFFICIELS : ils ont été placés un peu au-dessus
    //  du plus haut niveau observé entre le 17 octobre et le 16 novembre 2026.
    //  Ce ne sont PAS les seuils de Vigicrues.
    //
    //  Pour chaque station (repérée par son code) :
    //    vigilance : hauteur en mètres à partir de laquelle le marqueur devient ORANGE
    //    alerte    : hauteur en mètres à partir de laquelle le marqueur devient ROUGE
    //  En dessous de la vigilance, le marqueur est VERT.
    //  Écrire les nombres avec un POINT (2.50) et non une virgule (2,50).
    //  Une station absente de cette liste reste grise (« pas de seuil »).
    // =====================================================================
    const SEUILS = {
      'U471001003': { nom: "La Saône à Couzon-au-Mont-d'Or",    vigilance: 2.50, alerte: 3.50 },
      'U472002001': { nom: 'La Saône à Lyon [Pont La Feuillée]', vigilance: 2.60, alerte: 3.60 },
      'V300002001': { nom: 'Le Rhône à Lyon - Pont Morand',      vigilance: 1.50, alerte: 2.50 },
      'V301501002': { nom: "L'Yzeron à Craponne - Aval",         vigilance: 0.80, alerte: 1.20 },
      'V301502002': { nom: "L'Yzeron à Francheville - Pont",     vigilance: 1.20, alerte: 1.80 },
      // Stations en service mais sans mesure de hauteur sur le dernier mois (pas de seuil pour l'instant) :
      // U471001004 Saône à Couzon CNR, V300002002 Rhône Perrache-CNR, V300002003 Rhône Villeurbanne CNR,
      // V301502301 ruisseau de Charbonnières, V301502401 ruisseau du Ratier.
    };

    // Une mesure plus ancienne que ce délai est considérée comme « pas récente » (marqueur gris)
    const MESURE_RECENTE_HEURES = 24;
    // Tendance : on compare la dernière hauteur à celle d'il y a 3 heures
    const TENDANCE_HEURES = 3;
  </script>

  <!-- Leaflet (bibliothèque de carte), chargée depuis un CDN -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --vert: #2e7d32;
      --orange: #ef6c00;
      --rouge: #c62828;
      --gris: #8a94a3;
    }
    html, body {
      margin: 0;
      height: 100%;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #1b2430;
    }
    /* Bandeau en haut */
    #bandeau {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 48px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      background: #1b2430;
      color: #fff;
      font-size: 18px;
      font-weight: 600;
      z-index: 1000;
      box-shadow: 0 2px 6px rgba(0,0,0,.3);
      white-space: nowrap;
    }
    /* Petite ligne d'état à droite du titre */
    #etat {
      margin-left: auto;
      min-width: 0;
      font-size: 13px;
      font-weight: 400;
      color: #b8c4d4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* Mise en page sous le bandeau : carte (60 %) à gauche, main courante à droite */
    #espace {
      position: fixed;
      top: 48px; left: 0; right: 0; bottom: 0;
      display: flex;
    }
    #zone-carte {
      position: relative;
      flex: 0 0 60%;
    }
    #carte {
      position: absolute;
      inset: 0;
    }
    /* Sur téléphone (écran étroit) : la page défile normalement,
       la carte en haut, puis la main courante en entier en dessous */
    @media (max-width: 767px) {
      #espace { position: static; display: block; padding-top: 48px; }
      #zone-carte { height: 55vh; height: 55svh; }
    }
    /* Message d'erreur affiché par-dessus la carte si l'API ne répond pas */
    #message {
      position: absolute;
      top: 60px; left: 16px; right: 16px;   /* sous le bouton « + Point sensible », pour ne jamais le cacher */
      max-width: 480px;
      margin: 0 auto;
      padding: 12px 16px;
      background: #fff4e5;
      color: #5a3300;
      border: 1px solid #f0b46a;
      border-radius: 6px;
      font-size: 15px;
      line-height: 1.4;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
    }
    #message button {
      margin-top: 8px;
      padding: 6px 12px;
      font: inherit;
      border: 1px solid #c98a3a;
      border-radius: 4px;
      background: #fff;
      color: #5a3300;
      cursor: pointer;
    }
    /* Contenu de la bulle d'une station */
    .bulle h3 { margin: 0 0 4px; font-size: 15px; }
    .bulle p { margin: 2px 0; font-size: 14px; }
    .bulle .hauteur { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .bulle .gris { color: #666; }
    .bulle .demo { margin-top: 6px; font-size: 12px; font-style: italic; color: #8a4b00; }
    .pastille {
      font-size: 12px; font-weight: 600; color: #fff;
      padding: 2px 8px; border-radius: 10px;
    }
    /* Légende en bas à gauche */
    .legende {
      background: rgba(255,255,255,.95);
      padding: 8px 10px;
      border-radius: 6px;
      box-shadow: 0 1px 5px rgba(0,0,0,.3);
      font-size: 12px;
      line-height: 1.6;
      color: #222;
      margin-bottom: 36px !important; /* laisse la place à la ligne des crédits en bas */
    }
    .legende .ligne { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .legende .rond { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.25); flex: none; }
    .legende .note { margin-top: 2px; font-size: 11px; font-style: italic; color: #8a4b00; }

    /* Un élément marqué « hidden » reste caché, même s'il a une mise en forme flex */
    [hidden] { display: none !important; }

    /* ---------- Main courante (panneau de droite) ---------- */
    :root {
      --mc-fond: #f4f6f9;
      --mc-carte: #ffffff;
      --mc-bord: #d5dbe3;
      --mc-texte: #1b2430;
      --mc-discret: #5d6b7c;
      --type-evenement: #b42318;
      --type-decision: #1d4ed8;
      --type-moyen: #6d28d9;
      --type-information: #475569;
    }
    #panneau {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--mc-fond);
      color: var(--mc-texte);
      border-left: 1px solid var(--mc-bord);
    }
    /* Sur téléphone : le panneau s'allonge avec ses entrées (c'est la page entière qui défile),
       et la légende est plus compacte pour ne pas cacher la carte */
    @media (max-width: 767px) {
      #panneau { border-left: none; border-top: 1px solid var(--mc-bord); }
      #mc-liste { flex: none; overflow: visible; }
      .legende {
        display: grid;
        grid-template-columns: auto auto;
        column-gap: 10px;
        padding: 5px 8px;
        font-size: 11px;
        line-height: 1.5;
      }
      .legende .rond { width: 9px; height: 9px; }
      .legende .note { grid-column: 1 / -1; font-size: 10px; }
    }
    #panneau h2 {
      margin: 0;
      font-size: 16px;
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    #mc-compte { font-size: 13px; font-weight: 400; color: var(--mc-discret); }
    #mc-formulaire {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--mc-bord);
      background: var(--mc-carte);
    }
    #mc-formulaire .rangee { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    #mc-formulaire label { font-size: 13px; color: var(--mc-discret); }
    /* 16 px minimum : évite le zoom automatique de l'iPhone quand on touche un champ */
    #mc-type, #mc-texte {
      font: inherit;
      font-size: 16px;
      padding: 6px 8px;
      border: 1px solid var(--mc-bord);
      border-radius: 4px;
      background: #fff;
      color: var(--mc-texte);
    }
    #mc-type { flex: 1 1 auto; min-width: 0; }
    #mc-texte { width: 100%; box-sizing: border-box; min-height: 60px; resize: vertical; }
    #mc-ajouter {
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      background: #1b2430;
      color: #fff;
      cursor: pointer;
    }
    #mc-ajouter:focus-visible, .mc-entree button:focus-visible, #mc-reinit:focus-visible { outline: 2px solid #1d4ed8; outline-offset: 2px; }
    #mc-correction {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px;
      padding: 4px 8px;
      background: #fff7e0;
      border: 1px solid #f0d58a;
      border-radius: 4px;
    }
    #mc-correction button { font: inherit; font-size: 13px; border: none; background: none; color: var(--type-decision); cursor: pointer; text-decoration: underline; padding: 0; }
    #mc-erreur { font-size: 13px; color: var(--type-evenement); }
    #mc-avertissement { font-size: 13px; color: #8a4b00; padding: 8px 16px; background: #fff4e5; }
    #mc-liste {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      margin: 0;
      padding: 12px 16px;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #mc-vide { color: var(--mc-discret); font-size: 14px; padding: 4px 0; }
    .mc-entree {
      background: var(--mc-carte);
      border: 1px solid var(--mc-bord);
      border-left: 4px solid var(--couleur-type);
      border-radius: 4px;
      padding: 8px 10px;
      font-size: 14px;
    }
    .mc-entete { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--mc-discret); }
    .mc-numero { font-weight: 700; color: var(--mc-texte); font-variant-numeric: tabular-nums; }
    .mc-type {
      display: inline-flex; align-items: center; gap: 4px;
      font-weight: 600; color: #fff;
      background: var(--couleur-type);
      padding: 1px 8px; border-radius: 10px;
    }
    .mc-heure { font-variant-numeric: tabular-nums; }
    .mc-lien { font-size: 12px; margin-top: 4px; color: var(--mc-discret); font-style: italic; }
    .mc-texte { margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .mc-entree button {
      margin-left: auto;
      font: inherit; font-size: 12px;
      border: none; background: none; padding: 0;
      color: var(--type-decision); cursor: pointer; text-decoration: underline;
    }
    #mc-pied {
      padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px));
      border-top: 1px solid var(--mc-bord);
      font-size: 12px;
      color: var(--mc-discret);
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    #mc-reinit {
      margin-left: auto;
      font: inherit; font-size: 12px;
      border: none; background: none; padding: 0;
      color: var(--mc-discret); cursor: pointer; text-decoration: underline;
    }
    #mc-confirmation {
      width: 100%;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 8px;
      background: #fdecea;
      border: 1px solid #f3b7b0;
      border-radius: 4px;
      color: #7a1a12;
      font-size: 13px;
    }
    #mc-confirmation button { font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 4px; cursor: pointer; }
    #mc-oui { background: #b42318; color: #fff; border: 1px solid #b42318; }
    #mc-non { background: #fff; color: var(--mc-texte); border: 1px solid var(--mc-bord); }
    #mc-lieu {
      flex: 1 1 0; min-width: 0;   /* reste sur la ligne du libellé, même avec un nom long */
      font: inherit; font-size: 16px;
      padding: 6px 8px;
      border: 1px solid var(--mc-bord); border-radius: 4px;
      background: #fff; color: var(--mc-texte);
    }
    #mc-lieu:disabled { color: var(--mc-discret); background: var(--mc-fond); }
    /* Lien « 📍 nom du lieu » dans une entrée de la main courante */
    .mc-entree .mc-lieu {
      display: inline-flex; align-items: center; gap: 4px;
      margin: 6px 0 0;
      padding: 2px 8px;
      border-radius: 10px;
      background: #eef2f7;
      color: var(--mc-texte);
      font-size: 12px;
      text-decoration: none;
    }
    .mc-entree button.mc-lieu { cursor: pointer; border: 1px solid var(--mc-bord); }

    /* ---------- Points sensibles (sur la carte) ---------- */
    .ps-bouton {
      font: inherit; font-size: 14px; font-weight: 600;
      padding: 8px 12px;
      border: none; border-radius: 4px;
      background: #1b2430; color: #fff;
      cursor: pointer;
      box-shadow: 0 1px 5px rgba(0,0,0,.3);
    }
    .ps-bouton.actif { background: var(--orange); }
    .ps-bouton:focus-visible { outline: 2px solid #1d4ed8; outline-offset: 2px; }
    .ps-aide {
      margin-top: 6px;
      max-width: 200px;
      padding: 6px 10px;
      background: rgba(255,255,255,.95);
      border-radius: 4px;
      box-shadow: 0 1px 5px rgba(0,0,0,.3);
      font-size: 13px;
      color: #222;
    }
    #zone-carte.placement #carte { cursor: crosshair; }
    /* Sur téléphone : quand on revient à la carte, elle n'est pas cachée par le bandeau */
    #zone-carte { scroll-margin-top: 48px; }
    /* Fenêtre de création d'un point, posée en bas de la carte */
    #ps-formulaire {
      position: absolute;
      left: 12px; right: 12px; bottom: 12px;
      max-width: 360px;
      margin: 0 auto;
      z-index: 1001;
      display: flex; flex-direction: column; gap: 8px;
      padding: 12px;
      background: #fff;
      color: #1b2430;
      border-radius: 6px;
      box-shadow: 0 2px 10px rgba(0,0,0,.35);
    }
    #ps-formulaire h3 { margin: 0; font-size: 15px; }
    #ps-formulaire .rangee { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    #ps-formulaire label { font-size: 13px; color: #5d6b7c; }
    #ps-nom, #ps-type {
      font: inherit; font-size: 16px;
      padding: 6px 8px;
      border: 1px solid #d5dbe3; border-radius: 4px;
      background: #fff; color: #1b2430;
    }
    #ps-nom { width: 100%; box-sizing: border-box; }
    #ps-type { flex: 1 1 auto; min-width: 0; }
    #ps-creer, #ps-annuler { font: inherit; font-size: 15px; padding: 8px 14px; border-radius: 4px; cursor: pointer; }
    #ps-creer { font-weight: 600; background: #1b2430; color: #fff; border: 1px solid #1b2430; }
    #ps-annuler { background: #fff; color: #1b2430; border: 1px solid #d5dbe3; }
    #ps-erreur { font-size: 13px; color: #b42318; }
    /* Icône d'un point sensible sur la carte */
    .ps-icone {
      display: flex; align-items: center; justify-content: center;
      width: 30px; height: 30px;
      box-sizing: border-box;
      border-radius: 50%;
      background: #fff;
      border: 2px solid #1b2430;
      box-shadow: 0 1px 4px rgba(0,0,0,.4);
      font-size: 16px; line-height: 1;
    }
    .ps-icone.provisoire { border-style: dashed; opacity: .85; }
  </style>
</head>
<body>
  <header id="bandeau">Métis — Lyon <span id="etat">Chargement des stations…</span></header>
  <div id="espace">
    <div id="zone-carte">
      <div id="carte"></div>
      <div id="message" hidden></div>

      <!-- Création d'un point sensible (s'affiche après un toucher sur la carte) -->
      <form id="ps-formulaire" hidden novalidate>
        <h3>Nouveau point sensible</h3>
        <input id="ps-nom" type="text" maxlength="120" autocomplete="off"
               aria-label="Nom du point" placeholder="Nom (ex. : Hôpital Édouard-Herriot)">
        <div class="rangee">
          <label for="ps-type">Type</label>
          <select id="ps-type"></select>
        </div>
        <div class="rangee">
          <button type="submit" id="ps-creer">Créer le point</button>
          <button type="button" id="ps-annuler">Annuler</button>
          <span id="ps-erreur" role="alert"></span>
        </div>
      </form>
    </div>

    <!-- Main courante : journal horodaté de la gestion de crise -->
    <aside id="panneau" aria-label="Main courante">
      <form id="mc-formulaire" novalidate>
        <h2>Main courante <span id="mc-compte"></span></h2>
        <div class="rangee">
          <label for="mc-type">Type</label>
          <select id="mc-type">
            <option value="evenement">Événement</option>
            <option value="decision">Décision</option>
            <option value="moyen">Moyen engagé</option>
            <option value="information">Information</option>
          </select>
        </div>
        <div class="rangee">
          <label for="mc-lieu">Lieu</label>
          <select id="mc-lieu">
            <option value="">— Aucun (optionnel) —</option>
          </select>
        </div>
        <div id="mc-correction" hidden>
          <span id="mc-correction-texte"></span>
          <button type="button" id="mc-correction-annuler">Annuler</button>
        </div>
        <textarea id="mc-texte" rows="2" maxlength="1000" placeholder="Que se passe-t-il ? (ex. : Montée de la Saône, PC activé)"></textarea>
        <div class="rangee">
          <button type="submit" id="mc-ajouter">Ajouter</button>
          <span id="mc-erreur" role="alert"></span>
        </div>
      </form>
      <div id="mc-avertissement" hidden></div>
      <ol id="mc-liste" aria-live="polite"></ol>
      <div id="mc-pied">
        <span>Entrées non modifiables. Pour corriger : « Corriger ».</span>
        <button type="button" id="mc-reinit">Réinitialiser (démo)</button>
        <div id="mc-confirmation" hidden>
          <span id="mc-confirmation-texte"></span>
          <button type="button" id="mc-oui">Oui, tout effacer</button>
          <button type="button" id="mc-non">Annuler</button>
        </div>
      </div>
    </aside>
  </div>

  <script>
    // Carte centrée sur Lyon, zoom 12
    const carte = L.map('carte').setView([45.764, 4.836], 12);

    // Fond OpenStreetMap, avec l'attribution obligatoire
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">les contributeurs d’OpenStreetMap</a>'
        + ' · Hauteurs d’eau : <a href="https://hubeau.eaufrance.fr/page/api-hydrometrie">Hub’Eau</a>'
    }).addTo(carte);

    // ---------- Les 4 états possibles d'une station ----------
    const ETATS = {
      normal:    { libelle: 'Normal',    couleur: 'var(--vert)',   hexa: '#2e7d32' },
      vigilance: { libelle: 'Vigilance', couleur: 'var(--orange)', hexa: '#ef6c00' },
      alerte:    { libelle: 'Alerte',    couleur: 'var(--rouge)',  hexa: '#c62828' },
      inconnu:   { libelle: 'Pas de mesure récente', couleur: 'var(--gris)', hexa: '#8a94a3' }
    };

    // Légende des couleurs, en bas à gauche
    const legende = L.control({ position: 'bottomleft' });
    legende.onAdd = function () {
      const div = L.DomUtil.create('div', 'legende');
      const lignes = [
        [ETATS.normal.hexa, 'Normal'],
        [ETATS.vigilance.hexa, 'Vigilance'],
        [ETATS.alerte.hexa, 'Alerte'],
        [ETATS.inconnu.hexa, 'Pas de mesure récente']
      ];
      for (const [couleur, texte] of lignes) {
        const ligne = document.createElement('div');
        ligne.className = 'ligne';
        const rond = document.createElement('span');
        rond.className = 'rond';
        rond.style.background = couleur;
        ligne.append(rond, document.createTextNode(texte));
        div.appendChild(ligne);
      }
      const note = document.createElement('div');
      note.className = 'note';
      note.textContent = 'Seuils de démo, non officiels';
      div.appendChild(note);
      return div;
    };
    legende.addTo(carte);

    // ---------- Stations hydrométriques (API Hub'Eau Hydrométrie v2) ----------
    // Doc : https://hubeau.eaufrance.fr/page/api-hydrometrie
    const API = 'https://hubeau.eaufrance.fr/api/v2/hydrometrie';
    const ZONE = '4.70,45.65,5.00,45.85'; // longitude min, latitude min, longitude max, latitude max
    const DELAI_MAX = 15000;              // au-delà de 15 s sans réponse, on considère que l'API ne répond pas
    const HEURE = 3600 * 1000;

    const etat = document.getElementById('etat');
    const message = document.getElementById('message');
    const calqueStations = L.layerGroup().addTo(carte);

    // Appelle l'API et renvoie la réponse JSON (erreur si pas de réponse ou réponse invalide)
    async function appelerApi(url) {
      const controle = new AbortController();
      const minuteur = setTimeout(() => controle.abort(), DELAI_MAX);
      try {
        const reponse = await fetch(url, { signal: controle.signal });
        if (!reponse.ok) throw new Error('code ' + reponse.status);
        return await reponse.json();
      } finally {
        clearTimeout(minuteur);
      }
    }

    // Dernière hauteur d'eau (grandeur H) d'une station, ou null s'il n'y en a pas
    async function derniereHauteur(codeStation) {
      const url = API + '/observations_tr?code_entite=' + encodeURIComponent(codeStation)
        + '&grandeur_hydro=H&size=1&sort=desc&fields=code_station,date_obs,resultat_obs';
      const reponse = await appelerApi(url);
      return (reponse.data && reponse.data[0]) || null;
    }

    // Hauteur d'il y a 3 h (par rapport à la dernière mesure), à 30 min près ; null si introuvable
    async function hauteurPrecedente(codeStation, derniere) {
      const cible = new Date(derniere.date_obs).getTime() - TENDANCE_HEURES * HEURE;
      const debut = new Date(cible - 0.5 * HEURE).toISOString().slice(0, 19); // l'API attend une heure UTC
      const url = API + '/observations_tr?code_entite=' + encodeURIComponent(codeStation)
        + '&grandeur_hydro=H&size=200&sort=asc&date_debut_obs=' + debut
        + '&fields=date_obs,resultat_obs';
      const reponse = await appelerApi(url);
      let meilleure = null, meilleurEcart = Infinity;
      for (const obs of reponse.data || []) {
        const ecart = Math.abs(new Date(obs.date_obs).getTime() - cible);
        if (ecart <= 0.5 * HEURE && ecart < meilleurEcart) { meilleure = obs; meilleurEcart = ecart; }
      }
      return meilleure;
    }

    // L'API donne la hauteur en millimètres : on l'affiche en mètres
    function metres(valeur) {
      return valeur.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' m';
    }

    // L'API donne l'heure en temps universel (UTC) : on l'affiche à l'heure de Paris
    function heureDeParis(dateIso) {
      return new Date(dateIso).toLocaleString('fr-FR', {
        timeZone: 'Europe/Paris', day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    }

    // Normal / vigilance / alerte / inconnu, selon la hauteur et les seuils de la station
    function etatStation(r) {
      if (!r.mesure || !r.recente || !r.seuils) return 'inconnu';
      const h = r.mesure.resultat_obs / 1000;
      if (h >= r.seuils.alerte) return 'alerte';
      if (h >= r.seuils.vigilance) return 'vigilance';
      return 'normal';
    }

    // Texte de tendance : flèche + écart en cm
    function texteTendance(r) {
      if (!r.precedente) return 'Tendance sur ' + TENDANCE_HEURES + ' h : indisponible';
      const ecartCm = Math.round((r.mesure.resultat_obs - r.precedente.resultat_obs) / 10);
      const fleche = ecartCm > 0 ? '↑' : ecartCm < 0 ? '↓' : '→';
      const signe = ecartCm > 0 ? '+' : ecartCm < 0 ? '−' : '';
      const mot = ecartCm > 0 ? 'en hausse' : ecartCm < 0 ? 'en baisse' : 'stable';
      return 'Tendance sur ' + TENDANCE_HEURES + ' h : ' + fleche + ' ' + signe + Math.abs(ecartCm) + ' cm (' + mot + ')';
    }

    // Construit le contenu de la bulle (sans insérer de HTML venant de l'API)
    function contenuBulle(r) {
      const { station, mesure, seuils } = r;
      const e = ETATS[r.etat];
      const div = document.createElement('div');
      div.className = 'bulle';
      const ajouter = (balise, texte, classe) => {
        const el = document.createElement(balise);
        el.textContent = texte;
        if (classe) el.className = classe;
        div.appendChild(el);
        return el;
      };
      ajouter('h3', station.libelle_station || station.code_station);
      ajouter('p', 'Cours d’eau : ' + (station.libelle_cours_eau || 'non renseigné'));

      if (mesure) {
        const ligne = ajouter('p', 'Hauteur : ' + metres(mesure.resultat_obs / 1000), 'hauteur');
        const pastille = document.createElement('span');
        pastille.className = 'pastille';
        pastille.style.background = e.couleur;
        pastille.textContent = r.etat === 'inconnu' ? (seuils ? 'Mesure ancienne' : 'Pas de seuil') : e.libelle;
        ligne.appendChild(pastille);
        ajouter('p', texteTendance(r));
        ajouter('p', 'Mesure du ' + heureDeParis(mesure.date_obs) + ' (heure de Paris)');
        if (!r.recente) ajouter('p', 'Mesure de plus de ' + MESURE_RECENTE_HEURES + ' h : état non évalué.', 'gris');
      } else if (r.erreur) {
        ajouter('p', 'Hauteur indisponible : le service Hub’Eau n’a pas répondu.', 'gris');
      } else {
        ajouter('p', 'Pas de mesure de hauteur sur le dernier mois.', 'gris');
      }

      if (seuils) {
        ajouter('p', 'Seuils : vigilance ' + metres(seuils.vigilance) + ' · alerte ' + metres(seuils.alerte));
        ajouter('p', 'Seuils de démo, non officiels', 'demo');
      } else {
        ajouter('p', 'Aucun seuil défini pour cette station.', 'gris');
      }
      ajouter('p', 'Code station : ' + station.code_station, 'gris');
      return div;
    }

    function afficherErreur(texte) {
      message.textContent = '';
      const p = document.createElement('div');
      p.textContent = texte;
      const bouton = document.createElement('button');
      bouton.type = 'button';
      bouton.textContent = 'Réessayer';
      bouton.addEventListener('click', chargerStations);
      const fermer = document.createElement('button');
      fermer.type = 'button';
      fermer.textContent = 'Fermer';
      fermer.style.marginLeft = '8px';
      fermer.addEventListener('click', () => { message.hidden = true; });
      message.append(p, bouton, fermer);
      message.hidden = false;
    }

    // Récupère tout ce qu'il faut savoir sur une station (sans jamais faire échouer les autres)
    async function infosStation(station) {
      const r = { station, seuils: SEUILS[station.code_station] || null, mesure: null, precedente: null, recente: false, erreur: false };
      try {
        r.mesure = await derniereHauteur(station.code_station);
      } catch (e) {
        r.erreur = true;
      }
      if (r.mesure) {
        r.recente = Date.now() - new Date(r.mesure.date_obs).getTime() <= MESURE_RECENTE_HEURES * HEURE;
        try { r.precedente = await hauteurPrecedente(station.code_station, r.mesure); } catch (e) { /* tendance indisponible */ }
      }
      r.etat = etatStation(r);
      return r;
    }

    async function chargerStations() {
      message.hidden = true;
      calqueStations.clearLayers();
      etat.textContent = 'Chargement des stations…';

      // 1. Liste des stations en service dans la zone
      let stations;
      try {
        const reponse = await appelerApi(API + '/referentiel/stations?bbox=' + ZONE
          + '&en_service=1&format=json&size=200'
          + '&fields=code_station,libelle_station,libelle_cours_eau,longitude_station,latitude_station');
        stations = (reponse.data || []).filter(s => s.longitude_station != null && s.latitude_station != null);
      } catch (e) {
        etat.textContent = 'Stations indisponibles';
        afficherErreur('Les stations hydrométriques n’ont pas pu être chargées : le service Hub’Eau ne répond pas. '
          + 'La carte reste utilisable. Réessayez dans quelques minutes.');
        return;
      }
      if (stations.length === 0) {
        etat.textContent = 'Aucune station';
        afficherErreur('Hub’Eau ne signale aucune station hydrométrique en service dans la zone.');
        return;
      }

      // 2. Dernière hauteur et hauteur d'il y a 3 h, pour chaque station (en parallèle)
      const resultats = await Promise.all(stations.map(infosStation));

      // 3. Un marqueur par station ; les plus graves sont dessinés en dernier, donc au-dessus
      const ordre = { inconnu: 0, normal: 1, vigilance: 2, alerte: 3 };
      resultats.sort((a, b) => ordre[a.etat] - ordre[b.etat]);
      for (const r of resultats) {
        L.circleMarker([r.station.latitude_station, r.station.longitude_station], {
          radius: r.etat === 'inconnu' ? 7 : 9,
          color: '#fff',
          weight: 2,
          fillColor: ETATS[r.etat].hexa,
          fillOpacity: 0.95
        })
          .bindPopup(contenuBulle(r))
          .addTo(calqueStations);
      }

      // 4. Résumé dans le bandeau
      const compte = n => resultats.filter(r => r.etat === n).length;
      const morceaux = [stations.length + ' stations'];
      if (compte('alerte')) morceaux.push(compte('alerte') + ' alerte');
      if (compte('vigilance')) morceaux.push(compte('vigilance') + ' vigilance');
      if (!compte('alerte') && !compte('vigilance')) morceaux.push(compte('normal') + ' normales');
      etat.textContent = morceaux.join(' · ');

      if (resultats.every(r => r.erreur)) {
        afficherErreur('Les stations sont affichées, mais les hauteurs d’eau n’ont pas pu être chargées : '
          + 'le service Hub’Eau ne répond pas. Réessayez dans quelques minutes.');
      }
    }

    chargerStations();
  </script>

  <script>
    // =====================================================================
    //  MAIN COURANTE
    //  - chaque entrée : numéro, type, texte, date et heure (automatiques)
    //  - aucune modification ni suppression : on corrige par une nouvelle entrée
    //  - conservée dans ce navigateur (localStorage), donc après rechargement
    // =====================================================================
    const MC_CLE = 'metis.mainCourante.v1';
    const MC_TYPES = {
      evenement:   { libelle: 'Événement',    icone: '⚠', couleur: 'var(--type-evenement)' },
      decision:    { libelle: 'Décision',     icone: '✔', couleur: 'var(--type-decision)' },
      moyen:       { libelle: 'Moyen engagé', icone: '⛟', couleur: 'var(--type-moyen)' },
      information: { libelle: 'Information',  icone: 'ℹ', couleur: 'var(--type-information)' }
    };

    const mc = {
      formulaire: document.getElementById('mc-formulaire'),
      type: document.getElementById('mc-type'),
      texte: document.getElementById('mc-texte'),
      erreur: document.getElementById('mc-erreur'),
      liste: document.getElementById('mc-liste'),
      compte: document.getElementById('mc-compte'),
      avertissement: document.getElementById('mc-avertissement'),
      correction: document.getElementById('mc-correction'),
      correctionTexte: document.getElementById('mc-correction-texte'),
      lieu: document.getElementById('mc-lieu'),
      reinit: document.getElementById('mc-reinit'),
      confirmation: document.getElementById('mc-confirmation'),
      confirmationTexte: document.getElementById('mc-confirmation-texte')
    };
    let entrees = [];          // la liste des entrées, de la plus ancienne à la plus récente
    let correctionDe = null;   // numéro de l'entrée en cours de correction, ou null
    let stockageOk = true;

    function lireStockage() {
      try {
        const brut = localStorage.getItem(MC_CLE);
        const donnees = brut ? JSON.parse(brut) : [];
        return Array.isArray(donnees) ? donnees : [];
      } catch (e) {
        stockageOk = false;
        return [];
      }
    }

    function ecrireStockage() {
      try {
        localStorage.setItem(MC_CLE, JSON.stringify(entrees));
        stockageOk = true;
      } catch (e) {
        stockageOk = false;
      }
      mc.avertissement.hidden = stockageOk;
      if (!stockageOk) {
        mc.avertissement.textContent = 'Attention : ce navigateur refuse l’enregistrement (navigation privée ?). '
          + 'Les entrées seront perdues au rechargement de la page.';
      }
    }

    function dateHeure(iso) {
      // Toujours à l'heure de Paris, comme les mesures des stations
      return new Date(iso).toLocaleString('fr-FR', {
        timeZone: 'Europe/Paris',
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      });
    }

    // Affiche la liste, les plus récentes en haut
    function afficherEntrees() {
      mc.liste.textContent = '';
      mc.compte.textContent = entrees.length ? '(' + entrees.length + ')' : '';
      if (entrees.length === 0) {
        const vide = document.createElement('li');
        vide.id = 'mc-vide';
        vide.textContent = 'Aucune entrée pour l’instant. Choisissez un type, écrivez, puis « Ajouter ».';
        mc.liste.appendChild(vide);
        return;
      }
      // Qui corrige qui (calculé à l'affichage : l'entrée d'origine n'est jamais modifiée)
      const corrigeePar = {};
      for (const e of entrees) if (e.corrige) (corrigeePar[e.corrige] = corrigeePar[e.corrige] || []).push(e.n);

      for (const e of [...entrees].reverse()) {
        const type = MC_TYPES[e.type] || MC_TYPES.information;
        const li = document.createElement('li');
        li.className = 'mc-entree';
        li.style.setProperty('--couleur-type', type.couleur);

        const entete = document.createElement('div');
        entete.className = 'mc-entete';
        const numero = document.createElement('span');
        numero.className = 'mc-numero';
        numero.textContent = '#' + e.n;
        const badge = document.createElement('span');
        badge.className = 'mc-type';
        badge.textContent = type.icone + ' ' + type.libelle;
        const heure = document.createElement('time');
        heure.className = 'mc-heure';
        heure.dateTime = e.date;
        heure.textContent = dateHeure(e.date);
        const corriger = document.createElement('button');
        corriger.type = 'button';
        corriger.textContent = 'Corriger';
        corriger.addEventListener('click', () => commencerCorrection(e.n));
        entete.append(numero, badge, heure, corriger);
        li.appendChild(entete);

        if (e.corrige) {
          const lien = document.createElement('div');
          lien.className = 'mc-lien';
          lien.textContent = 'Correction de #' + e.corrige;
          li.appendChild(lien);
        }
        const texte = document.createElement('div');
        texte.className = 'mc-texte';
        texte.textContent = e.texte;
        li.appendChild(texte);

        // Lieu lié : « 📍 nom », qu'on touche pour voir le point sur la carte
        if (e.lieu) {
          const p = points.find(x => x.id === e.lieu);
          const lieu = document.createElement(p ? 'button' : 'span');
          lieu.className = 'mc-lieu';
          lieu.textContent = '📍 ' + (p ? p.nom : 'lieu inconnu');
          if (p) {
            lieu.type = 'button';
            lieu.title = 'Voir ce lieu sur la carte';
            lieu.addEventListener('click', () => montrerPoint(p.id));
          }
          li.appendChild(lieu);
        }

        if (corrigeePar[e.n]) {
          const note = document.createElement('div');
          note.className = 'mc-lien';
          note.textContent = 'Corrigée par ' + corrigeePar[e.n].map(n => '#' + n).join(', ');
          li.appendChild(note);
        }
        mc.liste.appendChild(li);
      }
    }

    function commencerCorrection(n) {
      correctionDe = n;
      mc.correctionTexte.textContent = 'Correction de #' + n;
      mc.correction.hidden = false;
      const origine = entrees.find(e => e.n === n);
      if (origine) {
        mc.type.value = origine.type;
        mc.lieu.value = origine.lieu && points.some(p => p.id === origine.lieu) ? origine.lieu : '';
      }
      mc.texte.focus();
    }

    function annulerCorrection() {
      correctionDe = null;
      mc.correction.hidden = true;
    }

    mc.formulaire.addEventListener('submit', ev => {
      ev.preventDefault();
      const texte = mc.texte.value.trim();
      if (!texte) {
        mc.erreur.textContent = 'Écrivez un texte avant d’ajouter.';
        mc.texte.focus();
        return;
      }
      mc.erreur.textContent = '';
      ajouterEntree({ type: mc.type.value, texte, corrige: correctionDe, lieu: mc.lieu.value || null });
      mc.texte.value = '';
      mc.lieu.value = '';
      annulerCorrection();
    });

    // Ajoute une entrée (depuis le formulaire, ou automatiquement à la création d'un point)
    function ajouterEntree({ type, texte, corrige, lieu }) {
      // On relit le stockage juste avant d'ajouter (au cas où un autre onglet aurait écrit entre-temps)
      const enStock = lireStockage();
      if (enStock.length > entrees.length) entrees = enStock;
      const entree = {
        n: entrees.reduce((max, e) => Math.max(max, e.n), 0) + 1,
        type,
        texte,
        date: new Date().toISOString()
      };
      if (corrige) entree.corrige = corrige;
      if (lieu) entree.lieu = lieu;
      entrees.push(Object.freeze(entree));
      ecrireStockage();
      afficherEntrees();
      mc.liste.scrollTop = 0;
      // Si la fenêtre du lieu est ouverte sur la carte, on la met à jour (liste des entrées liées)
      const m = lieu && marqueursPoints[lieu];
      if (m && m.isPopupOpen()) m.getPopup().update();
      return entree;
    }

    // Ctrl+Entrée (ou Cmd+Entrée) pour ajouter sans quitter le clavier
    mc.texte.addEventListener('keydown', ev => {
      if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) mc.formulaire.requestSubmit();
    });

    document.getElementById('mc-correction-annuler').addEventListener('click', annulerCorrection);

    // Réinitialisation (démo) : demande une confirmation dans la page avant d'effacer
    mc.reinit.addEventListener('click', () => {
      const vide = entrees.length === 0 && points.length === 0;
      mc.confirmationTexte.textContent = vide
        ? 'La main courante est déjà vide.'
        : 'Effacer définitivement les ' + entrees.length + ' entrées de la main courante'
          + (points.length ? ' et les ' + points.length + ' points sensibles' : '') + ' ?';
      document.getElementById('mc-oui').hidden = vide;
      mc.confirmation.hidden = false;
    });
    document.getElementById('mc-non').addEventListener('click', () => { mc.confirmation.hidden = true; });
    document.getElementById('mc-oui').addEventListener('click', () => {
      entrees = [];
      points = [];
      try { localStorage.removeItem(MC_CLE); } catch (e) { /* rien à faire */ }
      try { localStorage.removeItem(PS_CLE); } catch (e) { /* rien à faire */ }
      mc.confirmation.hidden = true;
      annulerCorrection();
      arreterPlacement();
      annulerCreation();
      afficherPoints();
      afficherEntrees();
    });

    // Si la main courante ou les points changent dans un autre onglet du même navigateur, on se met à jour
    window.addEventListener('storage', ev => {
      if (ev.key === MC_CLE) { entrees = lireStockage(); afficherEntrees(); }
      if (ev.key === PS_CLE) { points = lirePoints(); afficherPoints(); afficherEntrees(); }
    });

    // =====================================================================
    //  POINTS SENSIBLES
    //  - « + Point sensible », puis un toucher sur la carte place le point
    //  - nom + type (Hôpital, École, Poste électrique, Autre)
    //  - conservés dans ce navigateur, effacés par « Réinitialiser (démo) »
    //  - chaque création ajoute une entrée « Information » à la main courante
    // =====================================================================
    const PS_CLE = 'metis.pointsSensibles.v1';
    const PS_TYPES = {
      hopital: { libelle: 'Hôpital',          icone: '🏥' },
      ecole:   { libelle: 'École',            icone: '🏫' },
      poste:   { libelle: 'Poste électrique', icone: '⚡' },
      autre:   { libelle: 'Autre',            icone: '📌' }
    };
    const ps = {
      zone: document.getElementById('zone-carte'),
      formulaire: document.getElementById('ps-formulaire'),
      nom: document.getElementById('ps-nom'),
      type: document.getElementById('ps-type'),
      erreur: document.getElementById('ps-erreur'),
      annuler: document.getElementById('ps-annuler')
    };
    let points = [];                       // les points, du plus ancien au plus récent
    const marqueursPoints = {};            // identifiant du point → son marqueur sur la carte
    const calquePoints = L.layerGroup().addTo(carte);
    let placementActif = false;            // vrai entre « + Point sensible » et le toucher sur la carte
    let positionProvisoire = null;         // endroit touché, en attente du nom
    let marqueurProvisoire = null;

    for (const [cle, t] of Object.entries(PS_TYPES)) ps.type.add(new Option(t.icone + ' ' + t.libelle, cle));

    function typePoint(p) { return PS_TYPES[p.type] || PS_TYPES.autre; }

    function lirePoints() {
      try {
        const brut = localStorage.getItem(PS_CLE);
        const donnees = brut ? JSON.parse(brut) : [];
        return Array.isArray(donnees) ? donnees : [];
      } catch (e) {
        return [];
      }
    }

    function ecrirePoints() {
      try { localStorage.setItem(PS_CLE, JSON.stringify(points)); } catch (e) { stockageOk = false; }
    }

    // Icône ronde avec l'emoji du type (le HTML ne contient que nos propres emojis, jamais le texte saisi)
    function iconePoint(type, provisoire) {
      const t = PS_TYPES[type] || PS_TYPES.autre;
      return L.divIcon({
        className: '',
        html: '<div class="ps-icone' + (provisoire ? ' provisoire' : '') + '">' + t.icone + '</div>',
        iconSize: [30, 30],
        iconAnchor: [15, 15],
        popupAnchor: [0, -15]
      });
    }

    // Fenêtre d'un point : nom, type, date d'ajout, numéros des entrées liées
    function bullePoint(p) {
      const t = typePoint(p);
      const div = document.createElement('div');
      div.className = 'bulle';
      const ajouter = (balise, texte, classe) => {
        const el = document.createElement(balise);
        el.textContent = texte;
        if (classe) el.className = classe;
        div.appendChild(el);
      };
      ajouter('h3', t.icone + ' ' + p.nom);
      ajouter('p', 'Type : ' + t.libelle);
      ajouter('p', 'Ajouté le ' + dateHeure(p.date));
      const liees = entrees.filter(e => e.lieu === p.id).map(e => '#' + e.n);
      ajouter('p', 'Entrées liées : ' + (liees.length ? liees.join(', ') : 'aucune'));
      ajouter('p', 'Point sensible ' + p.id, 'gris');
      return div;
    }

    function afficherPoints() {
      calquePoints.clearLayers();
      for (const id in marqueursPoints) delete marqueursPoints[id];
      for (const p of points) {
        marqueursPoints[p.id] = L.marker([p.lat, p.lng], { icon: iconePoint(p.type), title: p.nom, zIndexOffset: 500 })
          // contenu recalculé à chaque ouverture ; la fenêtre s'ouvre sous le bouton « + Point sensible »
          .bindPopup(() => bullePoint(p), { autoPanPaddingTopLeft: L.point(10, 70), autoPanPaddingBottomRight: L.point(10, 10) })
          .addTo(calquePoints);
      }
      remplirMenuLieu();
    }

    // Menu « Lieu » du formulaire de la main courante
    function remplirMenuLieu() {
      const choix = mc.lieu.value;
      mc.lieu.textContent = '';
      mc.lieu.add(new Option(points.length ? '— Aucun (optionnel) —' : '— Aucun point sensible —', ''));
      for (const p of points) mc.lieu.add(new Option(typePoint(p).icone + ' ' + p.nom, p.id));
      mc.lieu.value = points.some(p => p.id === choix) ? choix : '';
      mc.lieu.disabled = points.length === 0;
    }

    // Depuis une entrée : on revient à la carte, centrée sur le point, fenêtre ouverte
    function montrerPoint(id) {
      const m = marqueursPoints[id];
      if (!m) return;
      ps.zone.scrollIntoView({ behavior: 'smooth', block: 'start' });  // sur téléphone, la carte est plus haut
      carte.setView(m.getLatLng(), Math.max(carte.getZoom(), 15));
      m.openPopup();
    }

    // Bouton « + Point sensible », en haut à droite de la carte
    let boutonPoint, aidePoint;
    const controlePoint = L.control({ position: 'topright' });
    controlePoint.onAdd = function () {
      const div = L.DomUtil.create('div');
      boutonPoint = document.createElement('button');
      boutonPoint.type = 'button';
      boutonPoint.className = 'ps-bouton';
      boutonPoint.textContent = '+ Point sensible';
      boutonPoint.setAttribute('aria-pressed', 'false');
      aidePoint = document.createElement('div');
      aidePoint.className = 'ps-aide';
      aidePoint.textContent = 'Touchez la carte à l’endroit du point.';
      aidePoint.hidden = true;
      div.append(boutonPoint, aidePoint);
      L.DomEvent.disableClickPropagation(div);   // toucher le bouton ne doit pas placer de point
      boutonPoint.addEventListener('click', () => (placementActif ? arreterPlacement() : demarrerPlacement()));
      return div;
    };
    controlePoint.addTo(carte);

    function demarrerPlacement() {
      annulerCreation();
      placementActif = true;
      boutonPoint.classList.add('actif');
      boutonPoint.textContent = 'Annuler le placement';
      boutonPoint.setAttribute('aria-pressed', 'true');
      aidePoint.hidden = false;
      ps.zone.classList.add('placement');
    }

    function arreterPlacement() {
      placementActif = false;
      if (!boutonPoint) return;
      boutonPoint.classList.remove('actif');
      boutonPoint.textContent = '+ Point sensible';
      boutonPoint.setAttribute('aria-pressed', 'false');
      aidePoint.hidden = true;
      ps.zone.classList.remove('placement');
    }

    // Le toucher sur la carte (un seul) qui place le point
    carte.on('click', ev => {
      if (!placementActif) return;
      carte.closePopup();   // si on a touché une station, on n'ouvre pas sa fenêtre
      arreterPlacement();
      ouvrirCreation(ev.latlng);
    });

    function ouvrirCreation(latlng) {
      positionProvisoire = latlng;
      marqueurProvisoire = L.marker(latlng, { icon: iconePoint(ps.type.value, true), interactive: false }).addTo(carte);
      ps.nom.value = '';
      ps.erreur.textContent = '';
      ps.formulaire.hidden = false;
      ps.nom.focus();
    }

    function annulerCreation() {
      if (marqueurProvisoire) marqueurProvisoire.remove();
      marqueurProvisoire = null;
      positionProvisoire = null;
      ps.formulaire.hidden = true;
    }

    ps.type.addEventListener('change', () => {
      if (marqueurProvisoire) marqueurProvisoire.setIcon(iconePoint(ps.type.value, true));
    });
    ps.annuler.addEventListener('click', annulerCreation);

    ps.formulaire.addEventListener('submit', ev => {
      ev.preventDefault();
      const nom = ps.nom.value.trim();
      if (!nom) {
        ps.erreur.textContent = 'Donnez un nom au point.';
        ps.nom.focus();
        return;
      }
      if (!positionProvisoire) return;
      // Comme pour la main courante : on relit le stockage avant d'ajouter
      const enStock = lirePoints();
      if (enStock.length > points.length) points = enStock;
      const n = points.reduce((max, p) => Math.max(max, Number(String(p.id).slice(1)) || 0), 0) + 1;
      const point = Object.freeze({
        id: 'P' + n,
        nom,
        type: ps.type.value,
        lat: Math.round(positionProvisoire.lat * 1e6) / 1e6,
        lng: Math.round(positionProvisoire.lng * 1e6) / 1e6,
        date: new Date().toISOString()
      });
      points.push(point);
      ecrirePoints();
      annulerCreation();
      afficherPoints();
      ajouterEntree({ type: 'information', texte: 'Point sensible ajouté : ' + nom, lieu: point.id });
      marqueursPoints[point.id].openPopup();
    });

    // Échap : annule le placement ou la création en cours
    document.addEventListener('keydown', ev => {
      if (ev.key !== 'Escape') return;
      if (placementActif) arreterPlacement();
      if (!ps.formulaire.hidden) annulerCreation();
    });

    // Démarrage
    points = lirePoints();
    afficherPoints();
    entrees = lireStockage();
    if (!stockageOk) ecrireStockage();
    afficherEntrees();
  </script>
</body>
</html>
